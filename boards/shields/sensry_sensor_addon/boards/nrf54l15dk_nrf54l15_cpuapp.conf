# SPI21 (PERI domain) drives the shield SPI pins on P2 (MCU domain).
# Cross-domain pin routing requires constant latency, including during startup.
CONFIG_NRF_SYS_EVENT=y
CONFIG_SOC_NRF_FORCE_CONSTLAT=y

# Fit a BMI270 configuration block in the EasyDMA staging buffer.
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=64
