title: |
  Racyics MIPI display driver

description: | 
  Summary -> TODO

  Here is an example to define a display device:

  \ {
        mipi-display@123456{
          compatible = "racyics,mipi-display";
          reg = <0x123456 0x123456>
          width = <123456>;
          height = <123456>;
          pixel-format = <PANEL_PIXEL_FORMAT_RGB_888>;
          status = "okay";
      };
  };

compatible: "racyics,mipi-display"

include : [display-controller.yaml, lcd-controller.yaml]

properties:
  reg:
    required: true
  i2c-bus:
    type: phandle
    required: true